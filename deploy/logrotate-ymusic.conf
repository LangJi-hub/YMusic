# YMusic 日志轮转
#
# 背景：systemd 用 StandardOutput=append:/var/log/ymusic/server.log 收集日志，
# 进程长期持有文件句柄。若用默认的 create 方式轮转，systemd 会继续往已重命名的
# 旧文件里写，磁盘照样被撑满 —— 必须用 copytruncate（先复制再原地截断）。
#
# 安装：install -m 0644 logrotate-ymusic.conf /etc/logrotate.d/ymusic

/var/log/ymusic/*.log {
    daily
    rotate 14
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su root root
}
